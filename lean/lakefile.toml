name = "EulerFactorChain"
version = "0.1.0"
keywords = ["math", "riemann", "euler-product"]
defaultTargets = ["EulerFactorChain"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "EulerFactorChain"
globs = ["EulerFactorChain", "Chain", "Superposition", "GeneratorPeak", "Crossover", "Covering", "Zeros", "Construction", "Measured", "PairIdentity", "SeedPerturbation", "TwinLattice", "Transform", "Isogeny", "TransferOp", "Propagation", "Nonvanishing", "MainTerm", "Expansion", "Schoenfeld", "Nyquist", "NyquistPeak", "ZeroCells", "ZerosStencil", "Elephant", "JointLadder", "RelativeGate", "RelativeLi", "Interpolant", "RouteCell", "DeepZeroBand", "TurnaroundLine", "Valves", "Landing", "DepthSix", "AllDepths", "ToInfinity", "ExactFloor", "RecipBound", "RecipIntegral", "SmoothRow", "ExactGate", "ExactBand", "ExactRH", "CornerSign", "EdgeDiagonal", "PiSieve", "PiRows", "PiChunks", "PiBlock0", "PiBlock4096", "PiBlock8192", "PiBlock12288", "PiBlock16384", "PiBlock20480", "PiBlock24576", "PiBlock28672", "PiBlock15last", "PiData15", "PiNarrow", "PNTDepth"]

<text class="labm" x="166" y="510" text-anchor="middle">{2}</text>
<text class="lab" x="359" y="500" text-anchor="middle">(8,3)</text>
<text class="labm" x="359" y="488" text-anchor="middle">{2,3} = the mod-6 lattice</text>
<text class="lab" x="640" y="410" text-anchor="end">(20,6)</text>
<text class="labm" x="640" y="398" text-anchor="end">{2,3,5,7,11}</text>

<!-- Connes marker: open ring, distinct shape -->
<circle cx="686.1" cy="425" r="6.5" fill="none" stroke="#C1651A" stroke-width="2.5"/>
<line x1="686.1" y1="425" x2="740" y2="460" stroke="#C1651A" stroke-width="1"/>
<text class="lab" x="745" y="463" fill="#C1651A">Connes  d = 6.40</text>
<text class="labm" x="745" y="476">λ = 13 · {2,3,5,7,11,13}</text>

<text class="labm" x="70" y="638">Diamonds: exact zeros of the dyadic prime difference table (r,d), verified unique to r ≤ 62, d ≤ 61.</text>
<text class="labm" x="70" y="652">Ring: the window Connes computes in. The only non-trivial table zero sits one prime short of it.</text>
</svg>

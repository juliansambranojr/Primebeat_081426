<g class="labm" text-anchor="middle">
<text x="166" y="605">λ=2</text><text x="359" y="605">λ=4</text><text x="551" y="605">λ=8</text>
<text x="648" y="605">λ=11.3</text><text x="744" y="605">λ=16</text>
</g>

<!-- table zeros: diamonds in ink, identity by shape + label -->
<g fill="#16181c">
<path d="M166.25,529 l7,8.5 l-7,8.5 l-7,-8.5 z"/>
<path d="M358.75,507 l7,8.5 l-7,8.5 l-7,-8.5 z"/>

  .axis  { stroke:#b9bec6; stroke-width:1; }
</style>

<!-- ============ PANEL A ============ -->
<text class="ttl" x="70" y="26">Connes' approximation error, first 50 zeros</text>
<text class="sub" x="70" y="42">Using only the primes ≤ 13 — a single window at depth d = 6.40. arXiv:2602.04022, §5.</text>


<!-- ============ PANEL B ============ -->
<text class="ttl" x="70" y="392">The shared coordinate: window depth</text>
<text class="sub" x="70" y="408">A cell at depth d spans a value window of ratio 2^(d+1); Connes' window [λ⁻¹,λ] has ratio λ². Equate: λ = 2^((d+1)/2).</text>

<line class="grid" x1="70" y1="560" x2="840" y2="560"/>
<line class="grid" x1="70" y1="515" x2="840" y2="515"/>
<line class="grid" x1="70" y1="470" x2="840" y2="470"/>
